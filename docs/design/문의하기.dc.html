<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;background:#EAEBEC;overflow:hidden}
html{overflow:hidden}
*{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;box-sizing:border-box}
a{color:#2F63B8;text-decoration:none}
a:hover{color:#1F4E9C}
.no-scrollbar{scrollbar-width:none}
.no-scrollbar::-webkit-scrollbar{display:none}
input,textarea{background:#F6F9FE;transition:background .18s ease,box-shadow .18s ease}
input:focus,textarea:focus{background:#fff}
</style>
<script src="./i18n.js"></script>
</helmet>

<div style="width:390px;height:844px;margin:40px auto">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="390" height="844" hint-size="390,844">
    <div style="position:relative;height:840px;width:100%;display:flex;flex-direction:column;background:#F3F6FB;color:#1E3557;overflow:hidden">

      <div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:63px 20px 12px;background:#fff;border-bottom:1px solid #EAF0FA;width:396px;height:96px">
        <a href="설정.dc.html" style="display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex-shrink:0">
          <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1.5 1.5 9l8 7.5" stroke="#1E3557" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <span style="font-size:16px;font-weight:800;color:#1E3557;letter-spacing:-0.3px">문의하기</span>
      </div>

      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 30px;text-align:center">
          <div style="width:52px;height:52px;border-radius:50%;background:#E7F4EE;display:flex;align-items:center;justify-content:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="#188A5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div style="font-size:15px;font-weight:700;color:#1E3557">문의가 접수됐어요</div>
          <div style="font-size:12.5px;color:#8FAAD0;line-height:1.6">관리자가 확인 후 입력하신 아이디로<br>답변을 드릴게요.</div>
          <a href="설정.dc.html" style="margin-top:10px;background:#4C86D8;color:#fff;border-radius:12px;padding:11px 22px;font-size:13.5px;font-weight:700">설정으로 돌아가기</a>
        </div>
      </sc-if>

      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
        <div class="no-scrollbar" style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch">
          <div style="padding:20px 16px 28px;display:flex;flex-direction:column;gap:18px">
            <p style="margin:0;font-size:12.5px;color:#8FAAD0;line-height:1.6">궁금한 점이나 문제가 있으면 남겨주세요.<br>입력하신 아이디(이메일)로 답변을 보내드려요.</p>

            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-size:12.5px;font-weight:700;color:#5A7CA8">이름</label>
              <input value="{{ name }}" oninput="{{ setName }}" placeholder="이름을 입력해 주세요" style="width:100%;border:none;outline:none;border-radius:12px;box-shadow:inset 0 0 0 1px #E6EDF7;padding:13px 14px;font-size:14px;color:#1E3557;background:#fff">
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-size:12.5px;font-weight:700;color:#5A7CA8">아이디(이메일)</label>
              <input value="{{ email }}" oninput="{{ setEmail }}" placeholder="답변 받을 이메일을 입력해 주세요" style="width:100%;border:none;outline:none;border-radius:12px;box-shadow:inset 0 0 0 1px #E6EDF7;padding:13px 14px;font-size:14px;color:#1E3557;background:#fff">
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <label style="font-size:12.5px;font-weight:700;color:#5A7CA8">내용</label>
              <textarea value="{{ content }}" oninput="{{ setContent }}" placeholder="문의하실 내용을 자세히 적어주세요" style="width:100%;border:none;outline:none;border-radius:12px;box-shadow:inset 0 0 0 1px #E6EDF7;padding:13px 14px;font-size:14px;color:#1E3557;background:#fff;resize:none;min-height:140px;font-family:inherit;line-height:1.5"></textarea>
            </div>

            <button onclick="{{ submit }}" disabled="{{ submitDisabled }}" style="{{ submitStyle }}">문의 보내기</button>
          </div>
        </div>
      </sc-if>

    </div>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', email: '', content: '', sent: false };

  renderVals() {
    const s = this.state;
    const canSubmit = s.name.trim() !== '' && s.email.trim() !== '' && s.content.trim() !== '';
    return {
      name: s.name, setName: (e) => this.setState({ name: e.target.value }),
      email: s.email, setEmail: (e) => this.setState({ email: e.target.value }),
      content: s.content, setContent: (e) => this.setState({ content: e.target.value }),
      submitDisabled: !canSubmit,
      submitStyle: canSubmit
        ? 'border:none;cursor:pointer;color:#fff;background:#4C86D8;border-radius:12px;padding:14px;font-size:14.5px;font-weight:700'
        : 'border:none;cursor:default;color:#A8BCD9;background:#EDF2FA;border-radius:12px;padding:14px;font-size:14.5px;font-weight:700',
      submit: () => { if (canSubmit) this.setState({ sent: true }); },
      sent: s.sent,
      showForm: !s.sent,
    };
  }
}

</script>
</body>
</html>
