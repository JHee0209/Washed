.primary{

  box-shadow:0 8px 20px rgba(47,99,184,.28);
  transition:transform .12s ease,box-shadow .18s ease;
}
.primary:active{transform:translateY(1px);box-shadow:0 4px 12px rgba(47,99,184,.24)}

.google{
  width:100%;height:52px;border:1.5px solid #E3EBF7;border-radius:14px;background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;

  transition:background .18s ease,border-color .18s ease;
}
.google:active{background:#F6F9FE;border-color:#CFDDF2}

.check{position:absolute;opacity:0;width:0;height:0}
.check + span{
  width:20px;height:20px;border-radius:6px;border:1.5px solid #CFDDF2;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:none;transition:all .15s ease;
}
.check + span svg{opacity:0;transition:opacity .15s ease}
.check:checked + span{background:#5B93E0;border-color:#5B93E0}
.check:checked + span svg{opacity:1}
.check:focus-visible + span{box-shadow:0 0 0 4px rgba(91,147,224,.18)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

<!-- 태극기 교체 (lang-picker 의 한국어 국기) -->
<style>
.washed-flag-kr{width:20px;height:14px;border-radius:3px;object-fit:cover;display:inline-block;vertical-align:-2px;box-shadow:0 0 0 1px rgba(47,99,184,.14)}
</style>
<script>
(function(){
  var SRC = './icons/flag-kr.png';
  var KR  = /\uD83C\uDDF0\uD83C\uDDF7/g;           // 🇰🇷
  function mkImg(){
    var i = document.createElement('img');
    i.src = SRC; i.alt = '\ub300\ud55c\ubbfc\uad6d'; i.className = 'washed-flag-kr';
    return i;
  }
  function fix(){
    document.querySelectorAll('lang-picker img').forEach(function(img){
      var s = img.getAttribute('src') || '';
      if (s.indexOf('flag-kr.png') > -1) return;
      if (/kr|ko|korea/i.test(s) || /\ud55c\uad6d|korea/i.test(img.getAttribute('alt') || '')) {
        img.src = SRC; img.classList.add('washed-flag-kr');
      }
    });
    document.querySelectorAll('lang-picker').forEach(function(p){
      var w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null), n, hits = [];
      while ((n = w.nextNode())) { KR.lastIndex = 0; if (KR.test(n.nodeValue)) hits.push(n); }
      hits.forEach(function(node){
        KR.lastIndex = 0;
        var parts = node.nodeValue.split(KR), frag = document.createDocumentFragment();
        parts.forEach(function(t, i){
          if (i) frag.appendChild(mkImg());
          if (t) frag.appendChild(document.createTextNode(t));
        });
        node.parentNode.replaceChild(frag, node);
      });
    });
  }
  function boot(){
    fix();
    new MutationObserver(fix).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
