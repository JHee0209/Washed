<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--color-primary:#f97316;--color-primary-strong:#ea580c;--color-primary-soft:#fff1e2;--color-bg:#faf7f3;--color-surface:#ffffff;--color-border:#ece5da;--color-text:#2b2620;--color-text-muted:#8a7f70;--color-text-faint:#bdb3a3;--color-neutral-soft:#f1ece4;--color-danger:#d1453b;--font-sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',system-ui,sans-serif;--text-xs:12px;--text-sm:13px;--text-md:14px;--text-base:15px;--text-lg:17px;--text-xl:20px;--weight-regular:400;--weight-medium:500;--weight-bold:700;--weight-black:900;--leading-tight:1.35;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-full:999px;--tap-min:44px;--control-height:48px;--icon-sm:14px;--icon-md:20px;--screen-width:390px;--screen-height:844px;--shadow-card:0 1px 2px rgba(43,38,32,.05),0 6px 16px rgba(43,38,32,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg)}
a{color:var(--color-primary);text-decoration:none}
a:hover{color:var(--color-primary-strong)}
</style>
</helmet>

<div style="width:var(--screen-width);height:var(--screen-height);background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);display:flex;flex-direction:column;overflow:hidden">

  <header style="flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);padding:var(--space-6) var(--space-5) var(--space-4)">
    <div style="display:flex;flex-direction:column;gap:var(--space-1)">
      <h1 style="margin:0;font-size:var(--text-xl);font-weight:var(--weight-black);letter-spacing:-0.01em">팀 일정 관리</h1>
      <p style="margin:0;font-size:var(--text-sm);color:var(--color-text-muted)">다가오는 일정</p>
    </div>
    <button type="button" aria-label="일정 추가" style="flex:0 0 auto;width:var(--tap-min);height:var(--tap-min);border:none;border-radius:var(--radius-full);background:var(--color-primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);cursor:pointer" style-hover="background:var(--color-primary-strong)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <sc-if value="{{hasSchedules}}" hint-placeholder-val="{{true}}">
    <div style="flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-3);padding:0 var(--space-5) var(--space-6)">
      <sc-for list="{{schedules}}" as="item" hint-placeholder-count="3">
        <button type="button" style="width:100%;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-sans);color:var(--color-text);cursor:pointer" style-hover="border-color:var(--color-primary)">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);width:100%">
            <span style="font-size:var(--text-lg);font-weight:var(--weight-bold);line-height:var(--leading-tight)">{{item.title}}</span>
            <sc-if value="{{item.changed}}" hint-placeholder-val="{{false}}">
              <span style="flex:0 0 auto;background:var(--color-primary-soft);color:var(--color-primary-strong);font-size:var(--text-xs);font-weight:var(--weight-bold);padding:var(--space-1) var(--space-2);border-radius:var(--radius-full);white-space:nowrap">변경됨</span>
            </sc-if>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);width:100%">
            <span style="display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-text-muted)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
              {{item.date}}
            </span>
            <span style="display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-text-muted)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
              {{item.time}}
            </span>
            <span style="display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-text-muted)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.3"></circle></svg>
              {{item.place}}
            </span>
          </div>
          <div style="display:flex;align-items:center;gap:var(--space-2);width:100%;padding-top:var(--space-3);border-top:1px solid var(--color-border);font-size:var(--text-sm);color:var(--color-text-muted)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M15.5 14.3c2.5.4 4.5 2.6 4.5 5.7"></path></svg>
            <span>{{item.attendeeLabel}}</span>
          </div>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <div style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);padding:var(--space-6)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      <p style="margin:0;font-size:var(--text-md);color:var(--color-text-muted)">예정된 일정이 없습니다</p>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;isEmpty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const isEmpty = !!this.props.isEmpty;
    return {
      isEmpty,
      hasSchedules: !isEmpty,
      schedules: [
        { title: '9월 정기 모임', date: '9월 12일(토)', time: '19:00', place: '스터디룸 B', attendeeLabel: '참석 8명', changed: false },
        { title: '가을 엠티 사전 모임', date: '9월 19일(토)', time: '18:30', place: '동아리방', attendeeLabel: '참석 5명', changed: true },
        { title: '10월 정기 모임', date: '10월 3일(토)', time: '19:00', place: '스터디룸 A', attendeeLabel: '참석 3명', changed: false }
      ]
    };
  }
}
</script>
</body>
</html>
